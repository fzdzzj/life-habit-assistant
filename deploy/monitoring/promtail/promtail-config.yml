server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: life-habit-assistant
    static_configs:
      - targets:
          - localhost
        labels:
          job: life-habit-assistant
          __path__: /logs/app.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: '"@timestamp"'
            level: log.level
            logger: log.logger
            message: message
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
      - output:
          source: message
