spring:
  datasource:
    url: jdbc:h2:mem:profile-test;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-jwt-secret-with-at-least-thirty-two-characters
  security:
    rate-limit:
      register-per-ip: 10000
      login-per-ip: 10000
      login-failures: 1000
      login-cooldown: 1h
  export:
    backfill-enabled: false
    storage:
      type: local
      local:
        directory: ./target/test-exports
