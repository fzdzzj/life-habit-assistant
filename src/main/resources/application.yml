spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: life-habit-assistant
  profiles:
    default: dev
  ai:
    model:
      # The OpenAI adapter is assembled manually from app.ai.advice.* so the
      # Spring AI auto-configuration must not force an API key at startup.
      chat: none
      embedding: none
      image: none
      audio:
        speech: none
        transcription: none
      moderation: none
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    baseline-on-migrate: ${FLYWAY_BASELINE_ON_MIGRATE:false}
server:
  error:
    include-message: never
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  security:
    refresh-token-ttl-minutes: ${REFRESH_TOKEN_TTL_MINUTES:43200}
    password-reset-ttl-minutes: ${PASSWORD_RESET_TTL_MINUTES:30}
    cors:
      allowed-origins:
        - http://localhost:5173
        - http://localhost:3000
    rate-limit:
      register-per-ip: 5
      login-per-ip: 20
      login-failures: 5
      login-cooldown: 15m
  pagination:
    max-offset: 10000
  report:
    cache-ttl: 10m
    cache-max-size: 128
  export:
    max-days: 1826
    max-pending-per-user: 5
    retention-days: 7
  health:
    minimum-sleep-minutes: 420
    maximum-sleep-minutes: 540
    minimum-hydration-ml: 1500
    minimum-exercise-minutes: 30
    minimum-diet-score: 3
  ai:
    advice:
      enabled: ${AI_ADVICE_ENABLED:false}
      api-key: ${OPENAI_API_KEY:}
      model: ${OPENAI_MODEL:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      daily-limit: ${AI_ADVICE_DAILY_LIMIT:3}
      monthly-limit: ${AI_ADVICE_MONTHLY_LIMIT:30}
      timeout-seconds: ${AI_ADVICE_TIMEOUT_SECONDS:30}
      prompt-version: ${AI_ADVICE_PROMPT_VERSION:v1}
      cache-ttl: ${AI_ADVICE_CACHE_TTL:10m}
      cache-max-size: ${AI_ADVICE_CACHE_MAX_SIZE:128}
    conversation:
      enabled: ${AI_CONVERSATION_ENABLED:false}
      context-days: ${AI_CONVERSATION_CONTEXT_DAYS:7}
      max-history-rounds: ${AI_CONVERSATION_MAX_HISTORY_ROUNDS:10}
      max-message-length: ${AI_CONVERSATION_MAX_MESSAGE_LENGTH:2000}
      stream-timeout-seconds: ${AI_CONVERSATION_STREAM_TIMEOUT_SECONDS:300}
      prompt-version: ${AI_CONVERSATION_PROMPT_VERSION:v1}
  drink:
    hydration-ratios:
      WATER: 1.0
      UNSWEETENED_TEA: 0.9
      COFFEE: 0.8
      MILK: 0.8
      JUICE: 0.5
      SUGAR_SWEETENED_DRINK: 0.0
      CARBONATED_SWEET_DRINK: 0.0
      ENERGY_DRINK: 0.0
      ALCOHOL: 0.0
      OTHER: 0.0
    sugary-risk-volume-ml: 500
    carbonated-sweet-risk-volume-ml: 330
    energy-drink-risk-volume-ml: 1
    alcohol-risk-volume-ml: 1
springdoc:
  info:
    title: 生活习惯助手 API
    description: 记录 → 趋势 → 报告 → 导出 → AI 建议/对话；/api/v1 承载新能力（身份、管理后台、AI 对话），旧 /api 端点保持兼容。
    version: 1.0.0
  swagger-ui:
    path: /swagger-ui.html
  group-configs:
    - group: v1
      paths-to-match: /api/v1/**
    - group: default
      paths-to-match: /**

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
